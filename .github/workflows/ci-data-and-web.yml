name: Data Quality Gate & Web Build CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  data-quality-gate:
    name: Python Pipeline & Data Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        working-directory: pipeline
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Rebuild warehouse, run Quality Gate & pytest
        working-directory: pipeline
        run: |
          .venv/bin/python scripts/build_warehouse.py
          .venv/bin/python scripts/quality_gate.py
          .venv/bin/python scripts/export_web_data.py
          .venv/bin/pytest -v tests/test_quality_gate.py

  web-build-and-lint:
    name: Next.js Build & Lint
    runs-on: ubuntu-latest
    needs: data-quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Lint & Production Build
        working-directory: web
        run: |
          npm run lint
          npm run build
