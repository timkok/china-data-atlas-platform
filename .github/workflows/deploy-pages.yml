name: Deploy Production Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Production Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build static export (58 pre-rendered pages + CSV bundles)
        working-directory: web
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: "/china-data-atlas-platform"
          NEXT_PUBLIC_SITE_URL: "https://timkok.github.io/china-data-atlas-platform"
        run: |
          npm run build
          touch out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
